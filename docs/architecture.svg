  <text x="50" y="112" font-size="12" font-weight="bold" fill="#FFFFFF">1. Android App & Sandbox</text>
  
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="220" height="40" rx="4" fill="#F7F6F2" stroke="#1A1A1A" stroke-width="1" />
