    <text x="10" y="24" font-size="11" font-weight="bold" fill="#1A1A1A">Firebase Storage buckets</text>
  </g>

  <!-- Flow Arrows & Connectors -->
  <path d="M 280 270 L 330 270" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-dasharray="4" />
  <polygon points="330,270 322,266 322,274" fill="#1A1A1A" />
  <text x="285" y="260" font-size="9" font-family="monospace">HTTPS</text>

  <path d="M 570 270 L 620 270" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-dasharray="4" />
  <polygon points="620,270 612,266 612,274" fill="#1A1A1A" />
  <text x="575" y="260" font-size="9" font-family="monospace">A2A</text>

  <path d="M 570 160 L 620 160" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <polygon points="620,160 162,156" fill="#1A1A1A" />

  <!-- Legend -->
  <rect x="40" y="475" width="820" height="45" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1" />
  <circle cx="60" cy="497" r="5" fill="#1A1A1A" />
  <text x="75" y="501" font-size="11" font-weight="bold">Standard Georgia Font Pairings</text>
  
  <circle cx="300" cy="497" r="5" fill="#3b82f6" />
  <text x="315" y="501" font-size="11" font-weight="bold">Interactive On-Device Mobile Sandbox</text>

  <circle cx="620" cy="497" r="5" fill="#10b981" />
  <text x="635" y="501" font-size="11" font-weight="bold">Cloud Run Pipeline Active</text>
