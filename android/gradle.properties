# Disable built-in Kotlin support in AGP 9.0+ to avoid conflicts with manual plugin application
android.builtInKotlin=false
android.newDsl=false

# Increase Gradle heap size to fix OutOfMemoryError during build
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Limit parallel execution to reduce memory pressure if needed
android.enableDexingArtifactTransform.parallel=false
