plugins {
    alias(libs.plugins.android.app)
    alias(libs.plugins.kotlin.compose.plugin)
    alias(libs.plugins.kotlin.android.plugin)
}

android {
    namespace 'com.android.mr.claimvoyantapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.android.mr.claimvoyantapp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Expose secrets from local.properties as BuildConfig fields
        def localProperties = new Properties()
        localProperties.load(rootProject.file('local.properties').newDataInputStream())
        buildConfigField "String", "GEMINI_API_KEY",    "\"${localProperties['gemini.api.key'] ?: ''}\""
        buildConfigField "String", "BACKEND_BASE_URL",  "\"${localProperties['BASE_URL']       ?: 'https://claimvoyant-api-395261322066.us-central1.run.app/'}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    // Networking
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.okhttp.sse

    // Image loading
    implementation libs.coil.compose

    // Google AI (Gemini cloud)
    implementation libs.generativeai

    // MLKit GenAI (on-device Gemma Nano)
    implementation libs.mlkit.genai

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
}
